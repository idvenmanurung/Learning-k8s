name: Docker CI
env:
  FORCE_JAVASCRIPT_ACTION_TO_NODE: true

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/learning-app:latest -f pr07/Dockerfile pr07

          docker tag \
          ${{ secrets.DOCKER_USERNAME }}/learning-app:latest \
          ${{ secrets.DOCKER_USERNAME }}/learning-app:${{ steps.vars.outputs.sha_short }}

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/learning-app:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Latest
        run: docker push ${{ secrets.DOCKER_USERNAME }}/learning-app:latest

      - name: Push SHA Tag
        run: docker push ${{ secrets.DOCKER_USERNAME }}/learning-app:${{ steps.vars.outputs.sha_short }}