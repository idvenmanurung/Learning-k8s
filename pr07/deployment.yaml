apiVersion: apps/v1
kind: Deployment

metadata:
  name: learning-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: learning-app

  template:
    metadata:
      labels:
        app: learning-app

    spec:
      containers:
        - name: learning-app

          image: idven/learning-app:latest

          ports:
            - containerPort: 3000

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"

            limits:
              memory: "128Mi"
              cpu: "200m"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 10
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 5