services:
  app:
    image: learning-app:v1
    ports:
      - "3003:3000"
    env_file:
      - config.env
    environment:
      DB_HOST: mysql
      DB_USER: user
      DB_PASSWORD: secret123
      DB_NAME: appdb
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    restart: always
    env_file:
      - config.env
    environment:
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_DATABASE: appdb
      MYSQL_USER: user
      MYSQL_PASSWORD: secret123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: