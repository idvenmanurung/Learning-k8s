apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-app  
  namespace: deploy
spec:
  replicas: 3         
  selector:
    matchLabels:
      app: learning-app
  template:
    metadata:
      labels:
        app: learning-app
    spec:
      containers:
        - name: learning-app-container
          image: idven/learning-app:latest 
          
          env:
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: learning-app-config
                  key: APP_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: learning-app-config
                  key: NODE_ENV
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: learning-app-secret
                  key: DB_PASSWORD

          # --- CARA 2: Konsumsi ConfigMap sebagai File Mount ---
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
      
      volumes:
        - name: config-volume
          configMap:
            name: learning-app-config
            items:
              - key: app-config.json
                path: app-config.json