replicaCount: 2

image:
  repository: idven/learning-app
  tag: has
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30001

resources:
  requests:
    cpu: 100m
    memory: 64Mi

  limits:
    cpu: 200m
    memory: 128Mi

ingress:
  enabled: false

env:
  NODE_ENV: production
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80